<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dovetail-9 slate interface</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0C0D}
a{color:#E0504A}a:hover{color:#F07A74}
button{font:inherit}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; padding: 24px 16px; background: #0B0C0D; color: #E8E4DA; font-family: 'IBM Plex Mono', monospace; font-size: 14px; line-height: 1.55;">
<div style="max-width: 1280px; margin: 0 auto; box-sizing: border-box;">

<div style="background: #0B0C0D; border: 1px solid #2A2D30; border-radius: 10px; overflow: hidden;">

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 20px; padding: 8px 20px; border-bottom: 1px solid #2A2D30; font-size: 11px; letter-spacing: 0.12em; color: #A8A49A;">
<span style="color: #E8E4DA;"><span style="color: {{accent}};">◉</span> QUELL ▸ {{hereLabel}}</span>
<span>STATION TIME 16:20</span>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 20px; border-bottom: 1px solid #2A2D30;">
<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
<path d="M17 2 A15 15 0 1 0 31.4 12.9" fill="none" stroke="#E8E4DA" stroke-width="2"></path>
<path d="M20.5 2.4 A15 15 0 0 1 31.6 10.6" fill="none" stroke="{{accent}}" stroke-width="2"></path>
<text x="17" y="23" text-anchor="middle" font-size="17" font-family="Chakra Petch, sans-serif" font-weight="600" fill="#E8E4DA">Σ</text>
</svg>
<div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 200px;">
<span style="font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 0.12em;">SIGMA</span>
<span style="font-size: 11px; letter-spacing: 0.1em; color: #A8A49A;">SYSTEMIC INTEGRATION GRID : MANAGEMENT AI</span>
</div>
<span style="font-size: 12px; letter-spacing: 0.08em; padding: 4px 10px; border: 1px solid {{accent}}; color: {{accent}}; border-radius: 4px;">ACCESS: GENERAL</span>
</div>

<div style="display: flex; flex-wrap: wrap;">

<nav aria-label="Station directory" style="flex: 1 1 260px; box-sizing: border-box; padding: 14px 8px; border-right: 1px solid #2A2D30; background: #0F1112;">
<div style="padding: 0 10px 8px 10px; font-size: 11px; letter-spacing: 0.12em; color: #A8A49A;">DIRECTORY</div>
<sc-for list="{{nodes}}" as="node" hint-placeholder-count="12">
<div style="{{node.rowStyle}}">
<sc-if value="{{node.hasKids}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{node.toggle}}" aria-label="{{node.toggleLabel}}" aria-expanded="{{node.expanded}}" style="flex-shrink: 0; width: 28px; min-height: 36px; padding: 0; background: none; border: none; color: #A8A49A; cursor: pointer; font-size: 12px;">{{node.chevron}}</button>
</sc-if>
<sc-if value="{{node.noKids}}" hint-placeholder-val="{{false}}">
<span aria-hidden="true" style="flex-shrink: 0; width: 28px;"></span>
</sc-if>
<button type="button" onClick="{{node.pick}}" style="{{node.btnStyle}}">
<span style="display: flex; align-items: center; gap: 8px; min-width: 0;">
<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{node.label}}</span>
<sc-if value="{{node.isHere}}" hint-placeholder-val="{{false}}">
<span style="flex-shrink: 0; font-size: 10px; letter-spacing: 0.08em; padding: 1px 6px; border-radius: 3px; background: {{accent}}; color: #0B0C0D; font-weight: 500;">YOU</span>
</sc-if>
</span>
<sc-if value="{{node.hasLock}}" hint-placeholder-val="{{false}}">
<span style="flex-shrink: 0; font-size: 10px; letter-spacing: 0.06em; padding: 1px 6px; border: 1px solid #5A4A2A; color: #D9A441; border-radius: 3px;">{{node.lock}}</span>
</sc-if>
</button>
</div>
</sc-for>
</nav>

<main style="flex: 999 1 520px; min-width: 0; box-sizing: border-box; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px;">
<div style="font-size: 12px; color: #A8A49A; overflow-wrap: anywhere;">{{path}}</div>
<h1 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 26px; letter-spacing: 0.04em;">{{locName}}</h1>

<sc-if value="{{isLocked}}" hint-placeholder-val="{{false}}">
<div style="border: 1px solid #5A4A2A; background: #16130C; color: #E8C887; padding: 16px 18px; border-radius: 6px; display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 12px; letter-spacing: 0.1em; color: #D9A441;">ACCESS: {{lockLabel}}</span>
<span>{{lockMsg}}</span>
</div>
</sc-if>

<sc-if value="{{isOpen}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 16px;">
<p style="margin: 0; white-space: pre-line; max-width: 64ch; color: #E8E4DA;">{{desc}}</p>
<sc-if value="{{hasScan}}" hint-placeholder-val="{{true}}">
<div style="font-size: 13px; color: #9FC7C2;">SCANNER ▸ {{scan}}</div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 11px; letter-spacing: 0.12em; color: #A8A49A;">CONTENTS</span>
<sc-for list="{{children}}" as="child" hint-placeholder-count="2">
<button type="button" onClick="{{child.pick}}" style="text-align: left; background: none; border: none; color: #E8E4DA; padding: 8px 4px; min-height: 40px; cursor: pointer; border-bottom: 1px solid #1E2123;">▸ {{child.label}}/</button>
</sc-for>
<sc-for list="{{files}}" as="file" hint-placeholder-count="2">
<button type="button" onClick="{{file.pick}}" style="{{file.btnStyle}}">{{file.name}}</button>
</sc-for>
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
<span style="color: #A8A49A; padding: 6px 4px;">(empty)</span>
</sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{fileOpen}}" hint-placeholder-val="{{false}}">
<div style="border: 1px solid #2A2D30; border-radius: 6px; background: #111315; overflow: hidden;">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 8px 8px 14px; border-bottom: 1px solid #2A2D30; font-size: 12px; letter-spacing: 0.06em; color: #A8A49A;">
<span style="overflow-wrap: anywhere;">{{fileName}}</span>
<button type="button" onClick="{{closeFile}}" aria-label="Close file" style="background: none; border: 1px solid #2E3236; color: #E8E4DA; border-radius: 4px; min-width: 44px; min-height: 36px; cursor: pointer;">✕</button>
</div>
<pre style="margin: 0; padding: 16px 18px; white-space: pre-wrap; overflow-x: auto; font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.6; color: #E8E4DA;">{{fileBody}}</pre>
</div>
</sc-if>
</main>
</div>

<div style="border-top: 1px solid #2A2D30; padding: 8px 20px; display: flex; flex-direction: column; gap: 2px; background: #0F1112;">
<sc-if value="{{helpOpen}}" hint-placeholder-val="{{false}}">
<div role="region" aria-label="Available commands" style="display: flex; flex-direction: column; gap: 6px; padding-bottom: 10px; border-bottom: 1px solid #1E2123;">
<span style="font-size: 11px; letter-spacing: 0.14em; color: #A8A49A;">AVAILABLE COMMANDS</span>
<sc-for list="{{commands}}" as="c" hint-placeholder-count="5">
<div style="display: flex; flex-wrap: wrap; gap: 2px 16px; font-size: 13px;">
<span style="flex: 0 0 12ch; color: {{accent}};">{{c.cmd}}</span>
<span style="flex: 1 1 200px; min-width: 0; color: #A8A49A;">{{c.desc}}</span>
</div>
</sc-for>
</div>
</sc-if>
<div style="font-size: 12px; color: #9FC7C2; min-height: 12px; white-space: pre-line;">{{termOut}}</div>
<div style="display: flex; align-items: center; gap: 10px;">
<label for="cmd" style="color: {{accent}}; font-weight: 500;">&gt;</label>
<input id="cmd" type="text" autocomplete="off" spellcheck="false" placeholder="type a command: ls, cd deck 02, cd galley, cd .., open RPE-0217.env, help" value="{{cmd}}" onChange="{{onCmd}}" onKeyDown="{{onKey}}" style="flex-grow: 1; min-width: 0; background: transparent; border: none; outline: none; color: #E8E4DA; font-family: 'IBM Plex Mono', monospace; font-size: 14px; min-height: 30px;">
</div>
</div>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E0504A","options":["#E0504A","#D9A441","#9FC7C2"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { loc: 'root', file: null, cmd: '', out: 'SIGMA: General access session open. Type help for commands.', collapsed: { d1: true, d2: true }, helpOpen: false };
    this.COMMANDS = [
      { cmd: 'ls', desc: 'List what is in this location.' },
      { cmd: 'cd <name>', desc: 'Move to a deck or room here.' },
      { cmd: 'cd ..', desc: 'Go back up one level.' },
      { cmd: 'cd /', desc: 'Return to the station overview.' },
      { cmd: 'open <file>', desc: 'Read a file in this location.' },
      { cmd: 'help', desc: 'Show or hide this list.' }
    ];
    this.NODES = [
      { id: 'root', label: 'DOVETAIL-9', depth: 0, parent: null },
      { id: 'd1', label: 'Deck 01', depth: 1, parent: 'root' },
      { id: 'd1a', label: 'Airlock A', depth: 2, parent: 'd1' },
      { id: 'd1b', label: 'Docking Control', depth: 2, parent: 'd1', lock: 'NO POWER' },
      { id: 'd2', label: 'Deck 02', depth: 1, parent: 'root' },
      { id: 'd2a', label: 'Corridor 2A', depth: 2, parent: 'd2' },
      { id: 'd2b', label: 'Galley', depth: 2, parent: 'd2' },
      { id: 'd2c', label: 'Crew Quarters', depth: 2, parent: 'd2' },
      { id: 'd2d', label: 'Hydroponics', depth: 2, parent: 'd2', lock: 'SEALED' },
      { id: 'd3', label: 'Deck 03', depth: 1, parent: 'root' },
      { id: 'd4', label: 'Deck 04', depth: 1, parent: 'root' },
      { id: 'd5', label: 'Deck 05', depth: 1, parent: 'root', lock: 'CLEARANCE 3' },
      { id: 'd6', label: 'Deck 06 to Deck 12', depth: 1, parent: 'root' }
    ];
    this.LOC = {
      root: { desc: 'SIGMA station directory.\n12 decks.', files: [] },
      d1: { desc: 'Docking ring. The Mistral is still at Bay A.\nCockpit lights on. I can see her through the port.', scan: 'no distortion', files: [] },
      d1a: { desc: 'Airlock A. Where I came in.', scan: 'no distortion', files: [
        { name: 'SIGMA_notice_0001.msg', body: 'SIGMA // NOTICE\n\nWelcome to Dovetail-9.\nAccess level: GENERAL.\nPlease remain within permitted areas.' }
      ] },
      d1b: { lockMsg: 'Terminal dark. No power to this section.' },
      d2: { desc: 'Habitation deck. Emergency lighting only. Quiet.', scan: 'faint distortion at several points', files: [] },
      d2a: { desc: 'Corridor 2A. A crew rota still pinned to the wall.\nTen years out of date.', scan: 'no distortion', files: [
        { name: 'crew_rota.txt', body: '[CREW ROTA: NAMES NOT YET WRITTEN]' }
      ] },
      d2b: { desc: 'Galley. Long tables. Chairs pushed back, never pushed in.\nA coffee machine on the far counter, its power light still green.', scan: 'faint constant distortion near the counter', files: [
        { name: 'RPE-0217.env', body: 'RPE-0217\n\nLOCATION    DECK 2 / GALLEY\nSIGNATURE   VOC spike, humidity +18%, thermal deficit 3.2 K\nDURATION    1.4 s\n\nINTENSITY\n2467   ██████████   1.00\n2470   █████████░   0.93\n2474   ████████░░   0.84\n2477   ████████░░   0.79\n\nSTATUS      ACTIVE / DECLINING\nCLASS       ENVIRONMENTAL FAULT' },
        { name: 'msg_shield-dip.msg', body: 'FROM     [R&D TECHNICIAN]\nTO       [R&D TECHNICIAN]\nSUBJECT  test 14\n\nShield bus dipped for 4 ms during test 14.\nSame timestamp, the section C sensor logs a micro-node. Inside the shielding.\n\nThey closed it as two tickets. Power fluctuation, sensor fault.\nThat is one event, not two.\n\nDon’t forward this.' }
      ] },
      d2c: { desc: 'Crew quarters. Bunks made. Lockers still full.', scan: 'faint distortion, bunk 14', files: [
        { name: 'bunk_assignments.rpt', body: '[ROSTER NOT YET WRITTEN]' }
      ] },
      d2d: { lockMsg: 'Door sealed. The override would open it.' },
      d3: { desc: '[Not yet designed]', files: [] },
      d4: { desc: '[Not yet designed]', files: [] },
      d5: { lockMsg: 'Research deck. Clearance 3 required. Your access: GENERAL.' },
      d6: { desc: '[Decks 06 to 12 not yet designed]', files: [] }
    };
  }

  node(id) { return this.NODES.find((n) => n.id === id); }

  pathOf(id) {
    const parts = [];
    let n = this.node(id);
    while (n) { parts.unshift(n.label); n = n.parent ? this.node(n.parent) : null; }
    return '/' + parts.join('/');
  }

  expandTo(id) {
    const c = { ...this.state.collapsed };
    let p = this.node(id).parent;
    while (p) { delete c[p]; p = this.node(p).parent; }
    return c;
  }

  go(id) { this.setState({ loc: id, file: null, collapsed: this.expandTo(id) }); }

  run(raw) {
    const input = raw.trim();
    const [verb, ...rest] = input.split(/\s+/);
    const arg = rest.join(' ');
    const here = this.node(this.state.loc);
    const loc = this.LOC[here.id] || { files: [] };
    const kids = this.NODES.filter((n) => n.parent === here.id);
    if (!input) return;
    // Help expands the prompt itself; any other command folds it away.
    if (verb === 'help') return this.setState({ helpOpen: !this.state.helpOpen, out: '' });
    this.setState({ helpOpen: false });
    if (verb === 'ls') {
      if (here.lock) return this.setState({ out: 'Access denied: ' + here.lock });
      const list = kids.map((k) => k.label + '/').concat((loc.files || []).map((f) => f.name));
      return this.setState({ out: list.length ? list.join('   ') : '(empty)' });
    }
    if (verb === 'cd') {
      if (arg === '/' ) return this.setState({ loc: 'root', file: null, out: '' });
      if (arg === '..') return here.parent ? this.setState({ loc: here.parent, file: null, out: '', collapsed: this.expandTo(here.parent) }) : this.setState({ out: 'Already at the top.' });
      const target = kids.find((k) => k.label.toLowerCase().startsWith(arg.toLowerCase()));
      if (!target || !arg) return this.setState({ out: 'No such location here: ' + arg });
      return this.setState({ loc: target.id, file: null, out: target.lock ? 'Access denied: ' + target.lock : '', collapsed: this.expandTo(target.id) });
    }
    if (verb === 'open') {
      if (here.lock) return this.setState({ out: 'Access denied: ' + here.lock });
      const f = (loc.files || []).find((x) => x.name.toLowerCase().startsWith(arg.toLowerCase()));
      if (!f || !arg) return this.setState({ out: 'No such file here: ' + arg });
      return this.setState({ file: f.name, out: '' });
    }
    this.setState({ out: 'SIGMA: Command not recognized.' });
  }

  renderVals() {
    const accent = this.props.accent ?? '#E0504A';
    const here = this.node(this.state.loc);
    const loc = this.LOC[here.id] || { files: [] };
    const locked = !!here.lock;
    const collapsed = this.state.collapsed;
    const hasKids = (id) => this.NODES.some((m) => m.parent === id);
    const visible = (n) => {
      let p = n.parent;
      while (p) { if (collapsed[p]) return false; p = this.node(p).parent; }
      return true;
    };
    const nodes = this.NODES.filter(visible).map((n) => {
      const sel = n.id === here.id;
      const kids = hasKids(n.id);
      const shut = !!collapsed[n.id];
      return {
        label: n.depth === 0 ? n.label + '/' : n.label,
        lock: n.lock || '',
        hasLock: !!n.lock,
        isHere: sel,
        hasKids: kids,
        noKids: !kids,
        expanded: !shut,
        chevron: shut ? '▸' : '▾',
        toggleLabel: (shut ? 'Expand ' : 'Collapse ') + n.label,
        toggle: () => this.setState({ collapsed: { ...collapsed, [n.id]: !shut } }),
        pick: () => this.go(n.id),
        rowStyle: 'display: flex; align-items: center; border-radius: 4px; padding-left: ' + (2 + n.depth * 16) + 'px; '
          + (sel ? 'background: #23272B; box-shadow: inset 2px 0 0 ' + accent + ';' : ''),
        btnStyle: 'display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-grow: 1; min-width: 0; text-align: left; min-height: 36px; cursor: pointer; border: none; background: transparent; padding: 6px 10px 6px 2px; color: '
          + (sel ? '#FFFFFF' : (n.lock ? '#A8A49A' : '#D6D2C8')) + ';'
      };
    });
    const children = locked ? [] : this.NODES.filter((n) => n.parent === here.id).map((n) => ({ label: n.label, pick: () => this.go(n.id) }));
    const fileList = locked ? [] : (loc.files || []);
    const files = fileList.map((f) => ({
      name: f.name,
      pick: () => this.setState({ file: f.name }),
      btnStyle: 'text-align: left; background: ' + (this.state.file === f.name ? '#1A1D20' : 'none') + '; border: none; color: #E8E4DA; padding: 8px 4px; min-height: 40px; cursor: pointer; border-bottom: 1px solid #1E2123;'
    }));
    const open = fileList.find((f) => f.name === this.state.file);
    return {
      accent,
      nodes,
      path: this.pathOf(here.id),
      hereLabel: here.depth === 0 ? 'STATION OVERVIEW' : this.pathOf(here.id).split('/').slice(2).join(' / ').toUpperCase(),
      locName: here.depth === 0 ? 'Station overview' : here.label,
      isLocked: locked,
      isOpen: !locked,
      lockLabel: here.lock || '',
      lockMsg: loc.lockMsg || '',
      desc: loc.desc || '',
      hasScan: !!loc.scan,
      scan: loc.scan || '',
      children,
      files,
      isEmpty: !locked && children.length === 0 && files.length === 0,
      fileOpen: !!open,
      fileName: open ? open.name : '',
      fileBody: open ? open.body : '',
      closeFile: () => this.setState({ file: null }),
      cmd: this.state.cmd,
      termOut: this.state.out,
      helpOpen: this.state.helpOpen,
      commands: this.COMMANDS,
      onCmd: (e) => this.setState({ cmd: e.target.value }),
      onKey: (e) => {
        if (e.key !== 'Enter') return;
        const v = this.state.cmd;
        // Dismiss the phone keyboard so it doesn't cover the help list.
        if (v.trim().toLowerCase() === 'help') e.target.blur();
        this.setState({ cmd: '' });
        this.run(v);
      }
    };
  }
}
</script>
</body>
</html>
